name: Ex Libris

image: https://exlibrisgroup.com/wp-content/uploads/ExLibris-logo-endorsed-color.png

description: Ex Libris provides library software and services for academic, research, and public libraries worldwide. Their portfolio includes
  Alma, Primo, Leganto, and other platforms that enable resource management, discovery, and digital services. The company focuses on integrated
  solutions for metadata, analytics, and collaborative networks, serving institutions of all sizes with cloud‑based and on‑premise options.

